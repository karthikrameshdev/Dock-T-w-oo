<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Antenna -->
  <line x1="12" y1="2" x2="12" y2="4.5" />
  <circle cx="12" cy="2" r="1" fill="currentColor" stroke="none" />

  <!-- Side Ear Pods -->
  <rect x="1.5" y="10" width="2" height="6" rx="1" />
  <rect x="20.5" y="10" width="2" height="6" rx="1" />

  <!-- Main Robot Monitor Head -->
  <rect x="3.5" y="4.5" width="17" height="15.5" rx="4.5" />

  <!-- Inner Face Screen -->
  <rect x="6" y="7.5" width="12" height="10" rx="2.5" stroke-width="1.2" />

  <!-- Eyebrows -->
  <path d="M7.8 9.8 Q8.8 8.8 9.8 9.6" stroke-width="1" />
  <path d="M14.2 9.6 Q15.2 8.8 16.2 9.8" stroke-width="1" />

  <!-- Eyes -->
  <circle cx="9" cy="12" r="1.2" fill="currentColor" stroke="none" />
  <circle cx="15" cy="12" r="1.2" fill="currentColor" stroke="none" />

  <!-- Friendly Smile -->
