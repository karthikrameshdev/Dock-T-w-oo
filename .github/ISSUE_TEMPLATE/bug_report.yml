name: 🐛 Bug Report
description: Report a bug, crash, or unexpected behavior in Dock T(w)oo
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much information as possible to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I click on the Brain dock icon, ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Launch Dock T(w)oo via `./run.sh`
        2. Open the Web Console
        3. Change dock width slider
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Version Details
      description: Please share your operating system and environment versions.
      placeholder: |
        - OS: macOS Sonoma 14.x / Ubuntu 22.04 / Windows 11
        - Python version: 3.12.x
        - PySide6 version: 6.12.x
        - Display setup: Dual monitors (Left/Right)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Traceback
      description: Please paste any relevant console output or stack traces.
      render: shell
