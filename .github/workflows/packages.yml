name: Native application packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0 portaudio19-dev
      - run: python -m pip install '.[build]'
      - run: python scripts/build_app.py
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v6
        with:
          name: DockTwoo-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 14
