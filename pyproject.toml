[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dock-t-w-oo"
version = "0.1.0"
description = "Dock T(w)oo - Modern Secondary Dock Panel for macOS, Windows, and Linux"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Karthik Ramesh", email = "karthik.ramesh.dev@gmail.com" }
]
dependencies = [
    "PySide6>=6.6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
dock-t-w-oo = "dock_twoo.main:main"
dock-twoo = "dock_twoo.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dock_twoo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
