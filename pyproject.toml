[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dock-t-w-oo"
version = "0.1.0"
description = "Dock T(w)oo - Modern Secondary Dock Panel for macOS, Windows, and Linux"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Karthik Ramesh", email = "karthik.ramesh.dev@gmail.com" }
]
dependencies = [
    "PySide6>=6.6.0",
    "cryptography>=42.0.0",
    "sounddevice>=0.5.3",
    "numpy>=1.26.0",
    "grpcio>=1.68,<2",
    "protobuf>=5,<8",
    "sherpa-onnx>=2.0.0,<3",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.26.0",
    "truststore>=0.10.0",
    "onnxruntime>=1.20,<2",
    "kokoro-onnx>=0.6.1,<1",
    "Pillow>=11",
    "pypdf>=5",
    "python-docx>=1.1",
    "tokenizers>=0.21",
    "pyobjc-framework-Cocoa>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'",
    "pyobjc-framework-ScreenCaptureKit>=11,<13; sys_platform == 'darwin'",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]
voice = [
    "torch>=2.3.0",
    "transformers>=5.14.0",
]

[project.scripts]
dock-t-w-oo = "dock_twoo.main:main"
dock-twoo = "dock_twoo.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dock_twoo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
dock_twoo = ["assets/**/*", "server/static/**/*", "brain/ecosystem/*.proto"]
